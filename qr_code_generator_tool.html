<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reliability DA · QR Generator</title>
<!-- QRCode library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
   :root{
     /* Same palette & tokens used in your LinkTree */
     --bg: linear-gradient(90deg, #6bd27d, #2ac3dd, #1b2a65);
     --panel:#ffffff10;             /* translucent card */
     --ink:#ffffff;                 /* primary text */
     --muted:#d0e6f2;               /* secondary text */
     --accent:#6bd27d;              /* green */
     --accent-2:#2ac3dd;            /* cyan (buttons) */
     --danger:#ff6b6b;
     --ok:#87fba4;
     --warn:#ffcc66;
     --radius:16px;
   }
   *{box-sizing:border-box}
   body{
     margin:0; padding:24px; background:var(--bg); color:var(--ink);
     font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
     min-height:100vh; display:flex; align-items:center; justify-content:center;
   }
   .wrap{
     width:100%; max-width:860px;
   }
   header{ text-align:center; margin-bottom:16px; }
   h1{ margin:0 0 8px; font-size:1.9rem; }
   p.lead{ margin:0; color:var(--muted); }
   .card{
     background:var(--panel);
     border:1px solid rgba(255,255,255,.2);
     border-radius:var(--radius);
     box-shadow:0 10px 30px rgba(0,0,0,.3);
     backdrop-filter: blur(8px);
     padding:22px;
   }
   .brand{
     display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:16px;
   }
   .brand img{
     width:min(260px,70%); height:auto; display:block;
     border-radius:12px; border:1px solid rgba(255,255,255,.25);
     box-shadow:0 8px 18px rgba(0,0,0,.25);
     background:rgba(0,0,0,.12);
   }
   .meta{
     display:flex; justify-content:center; gap:10px; margin:12px 0 16px 0; flex-wrap:wrap;
   }
   .pill{
     display:inline-block; padding:6px 10px; border-radius:999px;
     background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2);
     color:var(--muted); font-size:.82rem;
   }
   /* === QR TOOL AREA === */
   .tool{
     display:flex;
     flex-direction:column;
     align-items:center;
     gap:10px;
     margin-top:4px;
   }
   .tool-label{
     align-self:flex-start;
     font-size:0.9rem;
     color:var(--muted);
     margin-left:4px;
   }
   .tool input{
     width:100%;
     padding:12px;
     border-radius:10px;
     border:none;
     font-size:1rem;
     outline:none;
   }
   .tool button{
     width:100%;
     padding:14px 16px;
     border-radius:12px;
     border:1px solid rgba(255,255,255,.28);
     background:var(--accent-2);
     color:#0b1020;
     font-weight:700;
     font-size:1rem;
     text-align:center;
     box-shadow:0 10px 18px rgba(0,0,0,.22);
     cursor:pointer;
     transition:transform .08s ease, box-shadow .18s ease, filter .18s ease;
   }
   .tool button:hover{
     transform:translateY(-1px);
     filter:saturate(1.05);
     box-shadow:0 14px 24px rgba(0,0,0,.28);
   }
   #qr-container{
     margin-top:14px;
     padding:10px;
     background:rgba(255,255,255,0.12);
     border-radius:14px;
     display:flex;
     justify-content:center;
     align-items:center;
     min-height:240px;
   }
   footer{ text-align:center; margin-top:14px; color:var(--muted); font-size:.85rem; }
   @media (max-width:640px){
     body{ padding:18px; }
     .card{ padding:16px; }
     h1{ font-size:1.6rem; }
   }
</style>
</head>
<body>
<main class="wrap">
<header>
<h1>Reliability&nbsp;DA · QR Generator</h1>
<p class="lead">Generate QR codes for quick access to tools and reports.</p>
</header>
<section class="card">
<div class="brand">
<!-- Use your existing logo file name/path -->
<img src="Luma White logo (1).png" alt="LUMA Logo">
</div>
<div class="meta">
<span class="pill" id="lastUpdated">Last Updated: —</span>
</div>
<div class="tool">
<div class="tool-label">Text or URL</div>
<input id="userInput" type="text" placeholder="Paste URL or text here…" />
<button type="button" onclick="generateQR()">
         Generate QR Code
</button>
<div id="qr-container">
<!-- QR code will be injected here -->
</div>
</div>
<footer>
<span class="pill">Developed by Eiden O. Garcia Torres</span>
</footer>
</section>
</main>
<script>
   // Same "manual date" behavior you had
   (function updateLastUpdated(){
     const fixedDate = new Date('2025-08-21T20:40'); // update when you republish
     const opts = {
       weekday:'long', year:'numeric', month:'long', day:'numeric',
       hour:'numeric', minute:'numeric', hour12:true
     };
     document.getElementById('lastUpdated').textContent =
       'Last Updated: ' + fixedDate.toLocaleDateString('en-US', opts);
   })();
   function generateQR() {
     const container = document.getElementById("qr-container");
     container.innerHTML = ""; // clear any previous QR
     const data = document.getElementById("userInput").value.trim();
     if (!data) {
       alert("Please enter a URL or text first.");
       return;
     }
     new QRCode(container, {
       text: data,
       width: 220,
       height: 220,
       colorDark: "#000000",
       colorLight: "#ffffff",
       correctLevel: QRCode.CorrectLevel.L
     });
   }
</script>
</body>
</html>
