<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reliability DA · Tools</title>
  <style>
    :root{
      /* Same tokens as your LinkTree */
      --bg: linear-gradient(90deg, #6bd27d, #2ac3dd, #1b2a65);
      --panel:#ffffff10;
      --ink:#ffffff;
      --muted:#d0e6f2;
      --accent:#6bd27d;
      --accent-2:#2ac3dd;
      --radius:20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0; padding:32px; background:var(--bg); color:var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
    }

    /* Page header (outside panel) */
    .page-header{
      text-align:center; margin-bottom:16px;
    }
    .page-header h1{
      margin:0 0 6px; font-size:2rem; font-weight:800; letter-spacing:.2px;
    }
    .page-header .sub{ margin:0; color:var(--muted); }

    /* Glass panel like LinkTree */
    .panel{
      width:min(920px, 94vw);
      background:var(--panel);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.28);
      border-radius: var(--radius);
      box-shadow: 0 16px 36px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
      padding:26px;
    }

    /* Logo “card” same vibe */
    .logo-card{
      width:min(340px, 80%);
      margin:0 auto 12px;
      padding:18px 20px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.28);
      background:rgba(0,0,0,.15);
      box-shadow:0 10px 24px rgba(0,0,0,.28);
      display:flex; align-items:center; justify-content:center;
    }
    .logo-card img{
      max-width:100%; height:auto; display:block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }

    .meta{
      display:flex; justify-content:center; margin:8px 0 14px; flex-wrap:wrap;
    }
    .pill{
      display:inline-block; padding:8px 14px; border-radius:999px;
      background:rgba(255,255,255,.15);
      border:1px solid rgba(255,255,255,.25);
      color:var(--muted); font-size:.9rem;
    }

    /* Link list – match LinkTree spacing */
    .links{
      display:grid; grid-template-columns:1fr; gap:14px;
      margin:14px 0 18px;
    }

    /* Buttons to match LinkTree */
.btn {
  display:block; text-decoration:none; text-align:center;
  font-weight:700; color:#fff;
  padding:14px 16px; border-radius:14px;

  /* match your screenshot */
  background: transparent; 
  border: 1px solid rgba(255,255,255,.6);

  /* subtle glow/shadow like the LinkTree example */
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  transition: transform .08s ease, box-shadow .18s ease, filter .18s ease;
}
.btn:hover { 
  transform: translateY(-1px); 
  filter: brightness(1.1); 
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

    /* Footer pill in panel */
    .panel-footer{ display:flex; justify-content:center; }
    .by{ color:var(--muted); }

    @media (max-width:520px){
      body{ padding:22px; }
      .page-header h1{ font-size:1.7rem; }
      .pill{ font-size:.85rem; }
    }
  </style>
</head>
<body>
  <!-- Match LinkTree header -->
  <div class="page-header">
    <h1>Reliability DA · Tools</h1>
    <p class="sub">Quick access to interactive calculators.</p>
  </div>

  <!-- Glass panel -->
  <section class="panel">
    <div class="logo-card">
      <!-- Use the same logo image you used on LinkTree -->
      <img src="Luma White logo (1).png" alt="LUMA Logo">
    </div>

    <div class="meta">
      <span class="pill" id="lastUpdated">Last Updated: —</span>
    </div>

    <div class="links">
      <a class="btn" href="ip_calculator.html">IP Calculator</a>
      <a class="btn" href="ansi_overcurrent_calculator_with_graph.html">ANSI Overcurrent Trip Time Calculator</a>
    </div>

    <div class="panel-footer">
      <span class="pill by">Developed by Eiden O. Garcia Torres</span>
    </div>
  </section>

  <script>
    // Same manual "Last Updated" behavior as your LinkTree
    (function updateLastUpdated(){
      const fixedDate = new Date('2025-08-22T20:40'); // ← update manually on publish
      const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric',
                     hour:'numeric', minute:'numeric', hour12:true };
      document.getElementById('lastUpdated').textContent =
        'Last Updated: ' + fixedDate.toLocaleDateString('en-US', opts);
    })();
  </script>
</body>
</html>
